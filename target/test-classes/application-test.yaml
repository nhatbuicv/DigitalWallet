spring:
  # Testcontainers (@ServiceConnection) will override datasource/redis at runtime.
  # Dummy values below only satisfy ${...} placeholders in application.yaml
  # so the context can start without a real .env.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/digital_wallet_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  docker:
    compose:
      enabled: false

jwt:
  signerKey: test-dummy-signer-key-must-be-at-least-32-bytes-long-0123456789
  access-token-duration: 3600
  refresh-token-duration: 86400

esms:
  api-key: test
  secret-key: test

logging:
  level:
    root: WARN
    com.nhatbui: INFO
