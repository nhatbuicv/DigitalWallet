services:
  postgres:
    image: postgres:14.23
    container_name: digital-bank-postgres
    environment:
      POSTGRES_DB: digital_bank
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: