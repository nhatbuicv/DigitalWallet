spring:
  application:
    name: digital-wallet

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true


  data:
    redis:
      port: 6379
      host: localhost



  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: always
      platform: postgresql
      defer-datasource-initialization: true

esms:
  api-key: ${ESMS_API_KEY}
  secret-key: ${ESMS_SECRET_KEY}

server:
  port: 8080

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  access-token-duration: 3600
  refresh-token-duration: 86400

wallet:
  limits:
    defaults:
      single-transaction-limit: ${WALLET_DEFAULT_SINGLE_LIMIT:20000000}
      daily-limit: ${WALLET_DEFAULT_DAILY_LIMIT:50000000}
      monthly-limit: ${WALLET_DEFAULT_MONTHLY_LIMIT:100000000}
      customer-monthly-limit: ${WALLET_DEFAULT_CUSTOMER_MONTHLY_LIMIT:100000000}

