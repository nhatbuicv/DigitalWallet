spring:
  application:
    name: digital-wallet

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/digital_wallet
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      port: 6379
      host: localhost

  profiles:
    active: dev

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: always
      platform: postgresql
      defer-datasource-initialization: true

esms:
  api-key: ${ESMS_API_KEY}
  secret-key: ${ESMS_SECRET_KEY}

server:
  port: 8080

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  access-token-duration: 3600
  refresh-token-duration: 86400

