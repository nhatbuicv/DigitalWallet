spring:
  springdoc:
    api-docs:
      enabled: true
      path: /v3/api-docs
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      try-it-out-enabled: true
      operations-sorter: method
      tags-sorter: alpha
      display-request-duration: true
      doc-expansion: none

logging:
  level:
    root: DEBUG
    com.nhatbui: DEBUG
    org.springframework: DEBUG
    org.springdoc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE